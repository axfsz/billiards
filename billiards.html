<section class="home-screen" id="homeView" aria-labelledby="homeTitle">

function makeBall(n, x, y, meta = {}) {

function rackEight() {
  balls = [];

  ORDER.forEach((n, i) => {

function rackSnooker() {

  });
}

  loopNoise("lowpass", 1300, 0.4, 0.045);
  loopNoise("highpass", 4500, 0.5, 0.012);
}
function startBar() {
  const a = ac(); a.resume && a.resume();
  loopNoise("lowpass", 900, 0.5, 0.012);
  const chords = [
    [220.0, 261.63, 329.63, 392.0],
    [174.61, 261.63, 349.23, 440.0],
    [130.81, 261.63, 329.63, 392.0],
    [196.0, 246.94, 293.66, 392.0]
  ];
  let ci = 0;
  const playChord = () => chords[ci++ % chords.length].forEach((f, k) => padTone(f, 3.9, 0.03 - k * 0.005));
  playChord();
  ambTimers.push(setInterval(() => {
    playChord();
    if (Math.random() < 0.7) setTimeout(crackle, Math.random() * 2200);
  }, 4200));
}
function startCrowd() {
  const a = ac(); a.resume && a.resume();
  const g = loopNoise("bandpass", 420, 0.7, 0.05);
  const lfo = a.createOscillator(), lg = a.createGain();
  lfo.frequency.value = 0.13; lg.gain.value = 0.02;
  lfo.connect(lg).connect(g.gain);
  lfo.start();
  amb.push(lfo, lg);
  ambTimers.push(setInterval(() => {
    if (Math.random() < 0.55) {
      const t = a.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.10, t + 0.7);
      g.gain.linearRampToValueAtTime(0.05, t + 2.4);
    }
  }, 5200));
}
function applyScene(i) {
  sceneIdx = i;
  const s = SCENES[i];
  stopAmb();
  if (s.amb === "rain") startRain();
  else if (s.amb === "bar") startBar();
  else if (s.amb === "crowd") startCrowd();
  showToast("情景 · " + s.name);
}

function setFocusClass(active) {
  document.body.classList.toggle("mobile-focus", active);
  const button = document.getElementById("focusBtn");
  button.textContent = active ? "退出专注" : "横屏专注";
  button.setAttribute("aria-label", active ? "退出横屏专注模式" : "进入横屏专注模式");

async function enterMobileFocus() {
  setFocusClass(true);
  const shell = document.getElementById("gameShell");
  try {
    if (!document.fullscreenElement && shell.requestFullscreen) await shell.requestFullscreen({ navigationUI: "hide" });
    nativeFocusFullscreen = !!document.fullscreenElement;
  } catch (e) { nativeFocusFullscreen = false; }
  try { if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (e) {}
}

async function exitMobileFocus(fromFullscreen = false) {
  setFocusClass(false);
  try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
  if (!fromFullscreen && document.fullscreenElement && document.exitFullscreen) {
    try { await document.exitFullscreen(); } catch (e) {}
  }
  nativeFocusFullscreen = false;
}

document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && nativeFocusFullscreen) exitMobileFocus(true);
});
window.addEventListener("keydown", e => {
  const openDialog = document.querySelector(".modal.show, .decision.show");
  if (e.key === "Tab" && openDialog) {
    const focusable = [...openDialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
    if (focusable.length) { const first = focusable[0], last = focusable[focusable.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    return;
  }
  if (e.key !== "Escape") return;
  if (document.getElementById("rulesModal").classList.contains("show")) document.getElementById("closeRules").click();
  else if (document.getElementById("settingsModal").classList.contains("show")) document.getElementById("closeSettings").click();
  else if (document.getElementById("onlineModal").classList.contains("show")) closeOnlineModal();
  else if (document.body.classList.contains("mobile-focus")) exitMobileFocus();
});

function drawScene(dt) {
  const s = SCENES[sceneIdx];
  if (s.tint) {
    ctx.fillStyle = `rgba(${s.tint[0]},${s.tint[1]},${s.tint[2]},${s.tint[3]})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (s.lamp) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(CX, CY - 30, 40, CX, CY, PW * 0.62);
    g.addColorStop(0, `rgba(${s.lamp[0]},${s.lamp[1]},${s.lamp[2]},.15)`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (s.rain) {
    if (!rainDrops) rainDrops = Array.from({ length: 70 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      v: 600 + Math.random() * 500, l: 12 + Math.random() * 16, o: 0.04 + Math.random() * 0.08
    }));
    ctx.lineWidth = 1;
    for (const d of rainDrops) {
      d.y += d.v * dt; d.x -= d.v * dt * 0.18;
      if (d.y > H + 20) { d.y = -20; d.x = Math.random() * (W + 120); }
      ctx.globalAlpha = d.o;
      ctx.strokeStyle = "#b9d0ec";
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.l * 0.18, d.y - d.l);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- physics ---------- */
const FRICTION = 130, DAMP = 0.4, STOP_V = 6;
const E_BALL = 0.94, E_CUSH = 0.78, T_CUSH = 0.93;
const SIDE_MOUTH = 34, CORNER_MOUTH = 40, MOUTH_THROAT = 18, JAW_DEPTH = 16;
const POCKET_CAPTURE = PR - 4;
const cushions = [];

function addCushion(ax, ay, bx, by) {
  let nx = -(by - ay), ny = bx - ax;
  const nl = Math.hypot(nx, ny);
  nx /= nl; ny /= nl;
  if ((CX - (ax + bx) / 2) * nx + (CY - (ay + by) / 2) * ny < 0) { nx = -nx; ny = -ny; }
  cushions.push({ ax, ay, bx, by, nx, ny });
}

addCushion(L + CORNER_MOUTH, T, CX - SIDE_MOUTH, T);
addCushion(CX + SIDE_MOUTH, T, RT - CORNER_MOUTH, T);
addCushion(L + CORNER_MOUTH, BT, CX - SIDE_MOUTH, BT);
addCushion(CX + SIDE_MOUTH, BT, RT - CORNER_MOUTH, BT);
addCushion(L, T + CORNER_MOUTH, L, BT - CORNER_MOUTH);
addCushion(RT, T + CORNER_MOUTH, RT, BT - CORNER_MOUTH);
addCushion(CX - SIDE_MOUTH, T, CX - MOUTH_THROAT, T - JAW_DEPTH);
addCushion(CX + MOUTH_THROAT, T - JAW_DEPTH, CX + SIDE_MOUTH, T);
addCushion(CX - SIDE_MOUTH, BT, CX - MOUTH_THROAT, BT + JAW_DEPTH);
addCushion(CX + MOUTH_THROAT, BT + JAW_DEPTH, CX + SIDE_MOUTH, BT);
addCushion(L + CORNER_MOUTH, T, L + MOUTH_THROAT, T - JAW_DEPTH);
addCushion(L, T + CORNER_MOUTH, L - JAW_DEPTH, T + MOUTH_THROAT);
addCushion(RT - CORNER_MOUTH, T, RT - MOUTH_THROAT, T - JAW_DEPTH);
addCushion(RT, T + CORNER_MOUTH, RT + JAW_DEPTH, T + MOUTH_THROAT);
addCushion(L + CORNER_MOUTH, BT, L + MOUTH_THROAT, BT + JAW_DEPTH);
addCushion(L, BT - CORNER_MOUTH, L - JAW_DEPTH, BT - MOUTH_THROAT);
addCushion(RT - CORNER_MOUTH, BT, RT - MOUTH_THROAT, BT + JAW_DEPTH);
addCushion(RT, BT - CORNER_MOUTH, RT + JAW_DEPTH, BT - MOUTH_THROAT);

function pocketAt(x, y, radius = POCKET_CAPTURE) {
  return pockets.find(p => (x - p.x) ** 2 + (y - p.y) ** 2 < radius * radius) || null;
}

function cushionContact(b) {
  let best = null;
  for (const c of cushions) {
    const sx = c.bx - c.ax, sy = c.by - c.ay;
    const sl2 = sx * sx + sy * sy;
    const raw = ((b.x - c.ax) * sx + (b.y - c.ay) * sy) / sl2;
    const u = Math.max(0, Math.min(1, raw));
    const qx = c.ax + sx * u, qy = c.ay + sy * u;
    const dx = b.x - qx, dy = b.y - qy;
    let nx = c.nx, ny = c.ny, penetration;
    if (raw > 0 && raw < 1) {
      const side = dx * nx + dy * ny;
      if (side >= R || side < -R) continue;
      penetration = R - side;
    } else {
      const dist = Math.hypot(dx, dy);
      if (dist >= R) continue;
      if (dist > .001 && (dx * nx + dy * ny) > 0) { nx = dx / dist; ny = dy / dist; }
      penetration = R - dist;
    }
    if (!best || penetration > best.penetration) best = { nx, ny, penetration };
  }
  return best;
}

function resolveCushion(b, hit, railContacts) {
  b.x += hit.nx * hit.penetration;
  b.y += hit.ny * hit.penetration;
  const vn = b.vx * hit.nx + b.vy * hit.ny;
  if (vn >= 0) return;
  const tx = b.vx - vn * hit.nx, ty = b.vy - vn * hit.ny;
  b.vx = tx * T_CUSH - vn * E_CUSH * hit.nx;
  b.vy = ty * T_CUSH - vn * E_CUSH * hit.ny;
  if (Math.abs(vn) > 1 && !railContacts.has(b)) {
    railContacts.add(b);
    recordRail(b);
    sndCush(Math.abs(vn));
  }
}

function recordRail(b) {
  if (!shotFacts) return;
  if (b !== cue) shotFacts.objectRails.add(b.n);
  if (shotFacts.first) shotFacts.railAfter = true;
}

function step(dt, railContacts = new Set()) {
  for (const b of balls) {
    if (b.potted) continue;
    let sp = Math.hypot(b.vx, b.vy);
    if (sp > 0) {
      const ns = Math.max(0, sp - FRICTION * dt) * Math.max(0, 1 - DAMP * dt);
      if (ns < STOP_V && sp < 60) { b.vx = 0; b.vy = 0; }
      else { const k = ns / sp; b.vx *= k; b.vy *= k; }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (shotFacts && b === cue && b.x > HEAD) shotFacts.cueCrossedHead = true;

    let pocket = pocketAt(b.x, b.y);
    if (pocket) { potBall(b, pocket); continue; }

    const hit = cushionContact(b);
    if (hit) resolveCushion(b, hit, railContacts);

    pocket = pocketAt(b.x, b.y);
    if (pocket) { potBall(b, pocket); continue; }

    if (b.x < L || b.x > RT || b.y < T || b.y > BT) {
      pocket = pocketAt(b.x, b.y, PR + 2);
      if (pocket) { potBall(b, pocket); continue; }
      let nx = 0, ny = 0;
      if (b.x < L) { b.x = L + R; nx = 1; }
      else if (b.x > RT) { b.x = RT - R; nx = -1; }
      if (b.y < T) { b.y = T + R; ny = 1; }
      else if (b.y > BT) { b.y = BT - R; ny = -1; }
      const nl = Math.hypot(nx, ny);
      resolveCushion(b, { nx: nx / nl, ny: ny / nl, penetration: 0 }, railContacts);
    }
  }

  for (let i = 0; i < balls.length; i++) {
    const a = balls[i]; if (a.potted) continue;
    for (let j = i + 1; j < balls.length; j++) {
      const b = balls[j]; if (b.potted) continue;
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.hypot(dx, dy);
      if (d === 0) { dx = 0.01; d = 0.01; }
      if (d < 2 * R) {
        const nx = dx / d, ny = dy / d;
        const ov = (2 * R - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov;
        b.x += nx * ov; b.y += ny * ov;
        const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (vn > 0) {
          if (shotFacts) {
            const contacted = a === cue && b !== cue ? b : b === cue && a !== cue ? a : null;
            if (contacted && !shotFacts.first) {
              shotFacts.first = contacted;
              shotFacts.firstContactX = contacted.x;
              shotFacts.cueCrossedBeforeFirst = shotFacts.cueCrossedHead;
            }
          }
          const imp = vn * (1 + E_BALL) / 2;
          a.vx -= imp * nx; a.vy -= imp * ny;
          b.vx += imp * nx; b.vy += imp * ny;
          sndHit(vn);
        }
      }
    }
  }
}

function potBall(b, p) {
  b.potted = true;
  effects.push({ x: p.x, y: p.y, t: 0, c: b.c });
  sndPot();
  haptic(7);
  if (shotFacts && shotFacts.first) shotFacts.pocketAfter = true;
  if (b.n === 0) { cuePotted = true; }
  else { shotPots.push(b); shotPotEvents.push({ ball: b, pocket: p }); refreshHud(); }
}

function offTableBall(b) {
  b.potted = true; b.vx = 0; b.vy = 0;
  if (shotFacts) shotFacts.offTable.push(b);
  if (b === cue) cuePotted = true;
  refreshHud();
}

function allStopped() {
  return balls.every(b => b.potted || (b.vx === 0 && b.vy === 0));
}

function shoot() {
  shotPots = []; shotPotEvents = [];
  shotFacts = { first: null, railAfter: false, pocketAfter: false, breakShot: isBreak,
    objectRails: new Set(), offTable: [], kitchenShot: kitchenRestriction, cueCrossedHead: false,
    cueCrossedBeforeFirst: false, firstContactX: null,
    poolExpected: mode === "eight" && !isBreak ? (players[turn].group ? (poolGroupLeft(players[turn].group) ? players[turn].group : "eight") : "open") : null };
  kitchenRestriction = false;
  const v = 320 + power * 2080;
  cue.vx = Math.cos(aimAngle) * v;
  cue.vy = Math.sin(aimAngle) * v;
  shots++;
  matchStats[turn].shots++;
  trackEvent("shot", { mode, turn, power: Math.round(power * 100) });
  sndShoot(power);
  state = "roll";
  power = 0;
  refreshHud();
}

function finishMatch(title, text, winner = null) {
  matchWinner = winner;
  state = "over";
  renderResult(title, text, winner);
  document.getElementById("overlay").classList.add("show");
  trackEvent("game_finish", { mode, winner, shots, duration_seconds: Math.round((Date.now() - matchStartedAt) / 1000) });
  refreshHud();
}

function renderResult(title, text, winner) {
  const names = [0, 1].map(i => online.room?.players?.[onlineRole(i)]?.nickname || `Player ${i + 1}`);
  const elapsed = Math.max(1, Math.round((Date.now() - matchStartedAt) / 1000));
  const minutes = Math.floor(elapsed / 60), seconds = String(elapsed % 60).padStart(2, "0");
  const perspectiveTitle = online.room && winner !== null ? (onlineRoleIndex() === winner ? (settings.language === "en" ? "Victory" : "胜利") : (settings.language === "en" ? "Defeat" : "惜败")) : title;
  document.querySelector("#overlay h2").textContent = perspectiveTitle;
  document.getElementById("finalText").textContent = text;
  document.getElementById("resultScore").textContent = mode === "snooker" ? `${names[0]} ${players[0].score} : ${players[1].score} ${names[1]}` : winner === null ? `${names[0]} · ${names[1]}` : `${names[winner]} · ${settings.language === "en" ? "Winner" : "胜者"}`;
  const totalPots = matchStats[0].pots + matchStats[1].pots, totalFouls = matchStats[0].fouls + matchStats[1].fouls, maxStreak = Math.max(matchStats[0].maxStreak, matchStats[1].maxStreak);
  const stats = settings.language === "en" ? [[`${minutes}:${seconds}`,"Duration"],[shots,"Shots"],[totalPots,"Pots"],[totalFouls,"Fouls"],[maxStreak,"Best run"]] : [[`${minutes}:${seconds}`,"比赛时长"],[shots,"总击球"],[totalPots,"进球"],[totalFouls,"犯规"],[maxStreak,"最大连进"]];
  const root = document.getElementById("resultStats"); root.replaceChildren();
  stats.forEach(([value, label]) => { const item = document.createElement("div"); item.className = "result-stat"; const b = document.createElement("b"), span = document.createElement("span"); b.textContent = value; span.textContent = label; item.append(b, span); root.appendChild(item); });
}

async function shareResult() {
  const text = `${document.querySelector("#overlay h2").textContent} · ${document.getElementById("resultScore").textContent} · ${t("homeTitle")}`;
  try { if (navigator.share) await navigator.share({ title: t("homeTitle"), text, url: location.origin + location.pathname }); else { await navigator.clipboard.writeText(text); showToast(settings.language === "en" ? "Result copied" : "战绩已复制"); } }
  catch (e) { if (e.name !== "AbortError") showToast(settings.language === "en" ? "Could not share result" : "战绩分享未完成"); }
}

function switchTurn() { turn = 1 - turn; }

function legalPlacement(x, y, scope = placement ? placement.scope : "table") {
  if (x < L + R || x > RT - R || y < T + R || y > BT - R) return false;
  if (scope === "kitchen" && x > HEAD) return false;
  if (pockets.some(p => Math.hypot(x - p.x, y - p.y) < PR + R + 5)) return false;
  return balls.every(b => b === cue || b.potted || Math.hypot(x - b.x, y - b.y) >= 2 * R + 2);
}

function placementGuideText() {
  const suffix = placement?.scope === "kitchen" ? "（仅开球线后）" : "";
  return placement?.valid ? `位置合法${suffix} · ${coarsePointer ? "点击下方确认" : "双击确认"}` : `位置不可用${suffix} · 移动白球`;
}

function placementGuideBounds() {
  const text = placementGuideText();
  ctx.save();
  ctx.font = "600 18px PingFang SC, sans-serif";
  const width = ctx.measureText(text).width + 36;
  ctx.restore();
  return { text, x: CX - width / 2, y: BT - 48, w: width, h: 34 };
}

function updatePlacement(pos) {
  if (state !== "placement") return;
  placement.x = pos.x; placement.y = pos.y;
  placement.valid = legalPlacement(pos.x, pos.y, placement.scope);
  cue.x = pos.x; cue.y = pos.y; cue.vx = 0; cue.vy = 0; cue.potted = false;
  syncMobileControls();
}

function beginBallInHand(reason, scope = "table", message = "") {
  state = "placement";
  online.placementNotice = "";
  cuePotted = false;
  placement = { x: scope === "kitchen" ? L + PW * .12 : mouse.x, y: scope === "kitchen" ? CY : mouse.y, valid: false, scope };
  placementOrigin = { x: placement.x, y: placement.y };
  updatePlacement(placement);
  haptic([14, 24, 14]);
  document.getElementById("placementHelp").textContent = settings.language === "en" ? "Move the cue ball to a green legal position" : `${reason} · 移动白球到绿色合法区域`;
  showToast(message || `犯规 · ${reason} · Player ${turn + 1} 获得${scope === "kitchen" ? "线后" : "全台"}自由球`);
  refreshHud();
}

function confirmPlacement() {
  if (state !== "placement") return;
  if (!placement.valid) {
    showToast("此处不可放置白球 · 请选择绿色位置");
    return;
  }
  kitchenRestriction = placement.scope === "kitchen";
  placement = null;
  placementOrigin = null;
  state = "aim";
  if (coarsePointer) power = mobilePower;
  if (!coarsePointer) aimAngle = Math.atan2(mouse.y - cue.y, mouse.x - cue.x);
  cv.style.cursor = "crosshair";
  haptic(10);
  showToast(`Player ${turn + 1} 已确认白球位置`);
  refreshHud();
}

function updateDialogLock() {
  document.body.classList.toggle("dialog-open", !document.getElementById("homeView").hidden || document.getElementById("rulesModal").classList.contains("show") || document.getElementById("onlineModal").classList.contains("show") || document.getElementById("settingsModal").classList.contains("show") || document.getElementById("decisionModal").classList.contains("show"));
}

function hideDecision() {
  document.getElementById("decisionModal").classList.remove("show");
  updateDialogLock();
  setTimeout(restoreDialogFocus, 0);
}

function showDecision(title, text, options) {
  dialogReturnFocus = document.activeElement;
  state = "decision";
  document.getElementById("decisionTitle").textContent = title;
  document.getElementById("decisionText").textContent = text;
  const choices = document.getElementById("decisionChoices");
  choices.innerHTML = "";
  options.forEach(option => {

    choices.appendChild(button);
  });
  document.getElementById("decisionModal").classList.add("show");
  updateDialogLock();
  refreshHud();
  choices.querySelector("button").focus();
}

function rerackEight(opener, text) {
  hideDecision(); rackEight();
  players = [{ score: 0, group: null, fouls: 0 }, { score: 0, group: null, fouls: 0 }];
  turn = opener; rackBreaker = opener; isBreak = true; state = "aim"; cuePotted = false; placement = null; kitchenRestriction = false;
  shotPots = []; shotPotEvents = []; shotFacts = null;
  if (coarsePointer) power = mobilePower;
  showToast(text); refreshHud();
}

function registerEightFoul(reason, scope = "table") {
  const fouler = turn, opponent = 1 - fouler;
  players[fouler].fouls++;
  matchStats[fouler].fouls++;
  matchStats[fouler].streak = 0;
  trackEvent("foul", { mode, turn: fouler, reason });
  if (players[fouler].fouls >= 3) {
    finishMatch(`PLAYER ${opponent + 1} 获胜`, `Player ${fouler + 1} 连续第三次犯规`, opponent);
    return;
  }
  turn = opponent;
  beginBallInHand(reason, scope, `犯规：${reason} · Player ${fouler + 1} 连续犯规 ${players[fouler].fouls}/3 · Player ${opponent + 1} 获得${scope === "kitchen" ? "线后" : "全台"}自由球`);
}

function settleEightBreak() {
  const breaker = turn, incoming = 1 - breaker;
  const eightPotted = shotPots.some(b => b.n === 8);
  const eightOffTable = shotFacts.offTable.some(b => b.n === 8);
  const objectPotted = shotPots.length > 0;
  const breakFoul = cuePotted || shotFacts.offTable.length > 0;
  const legalBreak = objectPotted || shotFacts.objectRails.size >= 4;
  isBreak = false;

  if (eightOffTable) {
    finishMatch(`PLAYER ${incoming + 1} 获胜`, `Player ${breaker + 1} 将 8 号球击出台面`, incoming);
    return;
  }

  if (eightPotted) {
    rerackEight(breaker, `8 号球开球入袋 · 整组重摆 · Player ${breaker + 1} 重新开球`);
    return;
  }

  if (breakFoul || !legalBreak || !shotFacts.first) {
    registerEightFoul(breakFoul ? "开球犯规" : "非法开球", "kitchen");
    return;
  }

  players[breaker].fouls = 0;
  if (shotPots.length) showToast(`合法开球 · Player ${breaker + 1} 继续 · 球台开放`);
  else { turn = incoming; showToast(`合法开球未进球 · Player ${incoming + 1} 击球`); }
  state = "aim"; refreshHud();
}

function settleEight() {
  if (shotFacts.breakShot) { settleEightBreak(); return; }
  const first = shotFacts.first, group = players[turn].group;
  const expected = shotFacts.poolExpected || (group ? (poolGroupLeft(group) ? group : "eight") : "open");
  let reason = cuePotted ? "白球落袋" : !first ? "未碰到目标球" : null;
  if (!reason && ((expected === "open" && poolGroup(first) === "eight") || (expected !== "open" && poolGroup(first) !== expected))) reason = "先碰错球";
  if (!reason && shotFacts.kitchenShot && shotFacts.firstContactX < HEAD) reason = "线后自由球先碰线后目标球";
  if (!reason && shotFacts.offTable.length) reason = "球离开台面";
  if (!reason && !shotPots.length && !shotFacts.railAfter) reason = "碰球后无进球或碰库";
  const eight = shotPots.find(b => b.n === 8) || shotFacts.offTable.find(b => b.n === 8);
  if (eight) {
    const legalEight = !reason && expected === "eight" && first.n === 8 && !shotFacts.offTable.includes(eight);
    const winner = legalEight ? turn : 1 - turn;
    finishMatch(`PLAYER ${winner + 1} 获胜`, legalEight ? "清组后合法打进 8 号球" : `Player ${turn + 1} 提前打进、击出 8 号球或同时犯规`, winner);
    return;
  }
  if (reason) {
    registerEightFoul(reason);
    isBreak = false; refreshHud();
    return;
  }
  players[turn].fouls = 0;
  if (!group) {
    const firstPocketedGroup = shotPotEvents.map(e => poolGroup(e.ball)).find(g => g === "solid" || g === "stripe");
    if (firstPocketedGroup) {
      players[turn].group = firstPocketedGroup;
      players[1 - turn].group = firstPocketedGroup === "solid" ? "stripe" : "solid";
    }
  }
  const activeGroup = players[turn].group;
  const legalPots = activeGroup ? shotPots.filter(b => poolGroup(b) === activeGroup) : [];
  if (legalPots.length) {
    players[turn].score += legalPots.length;
    showToast(`Player ${turn + 1} 合法进 ${legalPots.length} 球 · 继续击球`);
  } else {
    switchTurn();
    showToast(`未进目标球 · Player ${turn + 1} 击球`);
  }
  isBreak = false;
  refreshHud();
}

function safeRespot(b) {
  const origin = b.spot || [L + PW * .22, CY];
  let x = origin[0], y = origin[1], d = 0;
  const free = (px, py) => balls.every(o => o === b || o.potted || Math.hypot(o.x - px, o.y - py) > 2 * R + 2);
  while (!free(x, y) && d < PW * .25) { d += 5; x = Math.min(RT - R, origin[0] + d); }
  b.x = x; b.y = y; b.vx = 0; b.vy = 0; b.potted = false;
}

function settleSnooker() {
  const first = shotFacts.first;
  const on = snookerTarget;
  const legalFirst = first && (on === "red" ? first.kind === "red" : on === "color" ? first.kind !== "red" && first.kind !== "cue" : first.kind === on);
  let reason = cuePotted ? "白球落袋" : !first ? "未碰到球" : !legalFirst ? "先碰错球" : null;
  const expectedPots = shotPots.filter(b => on === "red" ? b.kind === "red" : on === "color" ? first && b.kind === first.kind : b.kind === on);
  if (!reason && shotPots.some(b => !expectedPots.includes(b))) reason = "打进非目标球";
  const onValue = SNOOKER_COLORS[on] ? SNOOKER_COLORS[on].value : on === "red" ? 1 : 4;
  const relevant = Math.max(4, onValue, first ? first.value : 0, ...shotPots.map(b => b.value));
  if (reason) {
    matchStats[turn].fouls++;
    matchStats[turn].streak = 0;
    trackEvent("foul", { mode, turn, reason });
    players[1 - turn].score += relevant;
    shotPots.filter(b => b.kind !== "red").forEach(safeRespot);
    switchTurn();
    if (redsLeft()) snookerTarget = "red";
    else if (on === "red") { clearanceIndex = 0; snookerTarget = CLEARANCE[0]; }
    haptic([14, 24, 14]);
    showToast(`犯规：${reason} · 对手 +${relevant} 分`);
  } else if (expectedPots.length) {
    const gained = expectedPots.reduce((sum, b) => sum + b.value, 0);
    players[turn].score += gained;
    if (on === "red") {
      snookerTarget = "color";
    } else if (on === "color") {
      shotPots.forEach(safeRespot);
      if (redsLeft()) snookerTarget = "red";
      else { clearanceIndex = 0; snookerTarget = CLEARANCE[0]; }
    } else {
      clearanceIndex++;
      if (clearanceIndex >= CLEARANCE.length) {
        const a = players[0].score, b = players[1].score;
        const winner = a === b ? null : a > b ? 0 : 1;
        finishMatch(winner === null ? "平 局" : `PLAYER ${winner + 1} 获胜`, `Player 1 ${a} : ${b} Player 2`, winner);
        return;
      }
      snookerTarget = CLEARANCE[clearanceIndex];
    }
    showToast(`Player ${turn + 1} +${gained} 分 · 继续击球`);
  } else {
    switchTurn();
    if (on === "color" && redsLeft()) snookerTarget = "red";
    showToast(`未进球 · Player ${turn + 1} 击球`);
  }
  if (cuePotted) { respotCue(); cuePotted = false; }
  isBreak = false;
  refreshHud();
}

function settleShot() {
  const shooter = turn, potted = shotPots.filter(ball => ball.n !== 0).length;
  matchStats[shooter].pots += potted;
  matchStats[shooter].streak = potted ? matchStats[shooter].streak + potted : 0;
  matchStats[shooter].maxStreak = Math.max(matchStats[shooter].maxStreak, matchStats[shooter].streak);
  if (mode === "eight") settleEight(); else settleSnooker();
}

function respotCue() {
  let x = L + PW * (mode === "snooker" ? 0.14 : 0.22), y = mode === "snooker" ? CY + PH * .18 : CY;
  const free = (px, py) => balls.every(b => b === cue || b.potted || Math.hypot(b.x - px, b.y - py) > 2 * R + 2);
  while (!free(x, y) && x < RT - R) x += 6;
  cue.x = x; cue.y = y; cue.vx = 0; cue.vy = 0; cue.potted = false;
}

/* ---------- input ---------- */
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
let activePointer = null, lastPointerX = 0, lastPointerType = "mouse";
cv.addEventListener("pointermove", e => {
  if (!onlineCanUseTable()) return;
  if (activePointer !== null && e.pointerId !== activePointer) return;
  if (activePointer === null && e.pointerType !== "mouse") return;
  if (e.pointerType === "mouse") {
    const pos = toLocal(e);
    if (state === "placement") {
      cv.style.cursor = "crosshair";
      mouse = pos;
      updatePlacement(mouse);
    } else {
      mouse = pos;
      if (state === "aim" || state === "charge") aimAngle = Math.atan2(mouse.y - cue.y, mouse.x - cue.x);
    }
  } else {
    if (state === "placement") {
      const pos = toLocal(e);
      mouse = pos;
      updatePlacement(mouse);
    } else if (state === "aim") {
      aimAngle += (e.clientX - lastPointerX) * 0.0045;
    }
    lastPointerX = e.clientX;
  }
});
cv.addEventListener("pointerdown", e => {
  if (!onlineCanUseTable()) { showToast(state === "placement" ? placementBlockReason() : "等待服务器确认轮次或对手重连"); return; }
  if (activePointer !== null || (e.pointerType === "mouse" && e.button !== 0)) return;
  lastPointerType = e.pointerType;
  activePointer = e.pointerId;
  lastPointerX = e.clientX;
  cv.setPointerCapture(e.pointerId);
  ac() && AC.state === "suspended" && AC.resume();
  if (state === "placement") {
    const pos = toLocal(e);
    mouse = pos;
    updatePlacement(mouse);
    return;
  }
  if (e.pointerType === "mouse" && state === "aim") { state = "charge"; charging = true; chargeDir = 1; power = 0; }
});
cv.addEventListener("pointerup", e => {
  if (e.pointerId !== activePointer) return;
  if (e.pointerType === "mouse" && state === "charge") {
    charging = false;
    if (power > 0.05) { state = "aim"; requestShot(); }
    else state = "aim";
  }
  activePointer = null;
});
cv.addEventListener("pointercancel", e => {
  if (e.pointerId !== activePointer) return;
  if (state === "charge") { state = "aim"; charging = false; power = 0; }
  activePointer = null;
  syncMobileControls();
});
cv.addEventListener("dblclick", e => {
  if (lastPointerType !== "mouse" || e.button !== 0 || state !== "placement") return;
  e.preventDefault();
  if (!onlineCanUseTable()) { showToast(placementBlockReason()); return; }
  mouse = toLocal(e);
  updatePlacement(mouse);
  requestPlacement();
});
cv.addEventListener("contextmenu", e => e.preventDefault());

document.getElementById("restart").addEventListener("click", () => {
  if (online.room) { requestBilateral("RESTART"); return; }
  decisionResumeState = state;
  showDecision("确认重新开局", "当前局面和计分将被清除，重新由 Player 1 开球。", [
    { label: "确认重新开局", action: () => { hideDecision(); reset(0); showToast("重新开局 · Player 1 开球"); } },
    { label: "取消", action: () => { hideDecision(); state = decisionResumeState; refreshHud(); } }
  ]);
});
document.getElementById("again").addEventListener("click", () => {
  if (online.room) { requestBilateral("REMATCH"); return; }
  const opener = matchWinner === null ? 0 : matchWinner;
  const winnerOpens = matchWinner !== null;
  reset(opener);
  showToast(winnerOpens ? `胜者开球 · Player ${opener + 1}` : "平局重开 · Player 1 开球");
});

/* ---------- prediction ---------- */
function sweepRay(px, py, dx, dy, excl, maxLen) {
  let bt = maxLen || Infinity, hb = null;
  for (const b of balls) {
    if (excl.includes(b) || b.potted) continue;
    const ex = px - b.x, ey = py - b.y;
    const Bq = 2 * (dx * ex + dy * ey);
    const Cq = ex * ex + ey * ey - 4 * R * R;
    const disc = Bq * Bq - 4 * Cq;
    if (disc < 0) continue;
    const t = (-Bq - Math.sqrt(disc)) / 2;
    if (t > 0 && t < bt) { bt = t; hb = b; }
  }
  let wt = maxLen || Infinity;
  if (dx < 0) wt = Math.min(wt, (L + R - px) / dx);
  if (dx > 0) wt = Math.min(wt, (RT - R - px) / dx);
  if (dy < 0) wt = Math.min(wt, (T + R - py) / dy);
  if (dy > 0) wt = Math.min(wt, (BT - R - py) / dy);
  if (wt < bt) { bt = wt; hb = null; }
  return { t: bt, ball: hb };
}

function railAperture(axis, x, y) {
  if (axis === "x") return y < T + CORNER_MOUTH || y > BT - CORNER_MOUTH;
  return x < L + CORNER_MOUTH || x > RT - CORNER_MOUTH || Math.abs(x - CX) < SIDE_MOUTH;
}

function predict() {
  const d = { x: Math.cos(aimAngle), y: Math.sin(aimAngle) };
  const maxAim = settings.aimAssist === "short" ? 280 : 560;
  const h1 = sweepRay(cue.x, cue.y, d.x, d.y, [cue], maxAim);

  if (h1.ball) {
    const gx = cue.x + d.x * h1.t, gy = cue.y + d.y * h1.t;
    let nx = (h1.ball.x - gx) / (2 * R), ny = (h1.ball.y - gy) / (2 * R);
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;
    const h2 = sweepRay(h1.ball.x, h1.ball.y, nx, ny, [cue, h1.ball], 240);
    const dot = d.x * nx + d.y * ny;
    return {
      gx, gy, tx: nx, ty: ny,
      cx: d.x - dot * nx, cy: d.y - dot * ny,
      ball: true,
      sec: { x: h1.ball.x + nx * h2.t, y: h1.ball.y + ny * h2.t, ball: !!h2.ball }
    };
  }

  if (h1.t >= maxAim) return { gx: cue.x + d.x * maxAim, gy: cue.y + d.y * maxAim, ball: false, ref: null };

  let ax = "x";
  let wt = Infinity;
  if (d.x < 0 && (L + R - cue.x) / d.x < wt) { wt = (L + R - cue.x) / d.x; ax = "x"; }
  if (d.x > 0 && (RT - R - cue.x) / d.x < wt) { wt = (RT - R - cue.x) / d.x; ax = "x"; }
  if (d.y < 0 && (T + R - cue.y) / d.y < wt) { wt = (T + R - cue.y) / d.y; ax = "y"; }
  if (d.y > 0 && (BT - R - cue.y) / d.y < wt) { wt = (BT - R - cue.y) / d.y; ax = "y"; }
  const ix = cue.x + d.x * Math.max(0, wt), iy = cue.y + d.y * Math.max(0, wt);
  let rx = d.x, ry = d.y;
  if (ax === "x") rx = -rx; else ry = -ry;
  return { gx: ix, gy: iy, ball: false, ref: railAperture(ax, ix, iy) ? null : { ix, iy, rx, ry } };
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const cl = v => Math.max(0, Math.min(255, v));
  const r = cl((n >> 16) + amt), g = cl(((n >> 8) & 255) + amt), b = cl((n & 255) + amt);
  return `rgb(${r},${g},${b})`;
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawAiming() {

  ctx.save();

  ctx.strokeStyle = "rgba(255,255,255,.6)";
  ctx.setLineDash([7, 8]);
  ctx.lineDashOffset = -march;
  ctx.beginPath();
  ctx.moveTo(cue.x + Math.cos(aimAngle) * (R + 3), cue.y + Math.sin(aimAngle) * (R + 3));
  ctx.lineTo(pred.gx, pred.gy);
  ctx.stroke();

  ctx.beginPath(); ctx.arc(pred.gx, pred.gy, R, 0, 7);
  ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.stroke();
  ctx.beginPath(); ctx.arc(pred.gx, pred.gy, 2, 0, 7);
  ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.fill();

  const arrow = (x, y, dx, dy, size, color) => {
    const a = Math.atan2(dy, dx);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * size, y + Math.sin(a) * size);
    ctx.lineTo(x + Math.cos(a + 2.5) * size, y + Math.sin(a + 2.5) * size);
    ctx.lineTo(x + Math.cos(a - 2.5) * size, y + Math.sin(a - 2.5) * size);
    ctx.closePath(); ctx.fill();

  if (pred.ball) {
    const ex = pred.gx + pred.tx * 55, ey = pred.gy + pred.ty * 55;
    const tg = ctx.createLinearGradient(pred.gx, pred.gy, ex, ey);
    tg.addColorStop(0, "rgba(255,235,160,.95)");
    tg.addColorStop(1, "rgba(255,200,90,.75)");
    ctx.strokeStyle = tg; ctx.lineWidth = 2.5 * aimWeight; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(pred.gx, pred.gy);
    ctx.lineTo(ex, ey); ctx.stroke();
    arrow(ex, ey, pred.tx, pred.ty, 8, "rgba(255,215,120,.95)");

    if (pred.sec) {
      ctx.setLineDash([3, 6]);
      ctx.strokeStyle = "rgba(255,235,160,.4)";
      ctx.lineWidth = 1.5 * aimWeight;
      ctx.beginPath(); ctx.moveTo(pred.gx, pred.gy);
      ctx.lineTo(pred.sec.x, pred.sec.y); ctx.stroke();

    ctx.setLineDash([1, 5]);

    ctx.lineWidth = 1.5 * aimWeight;
    ctx.beginPath(); ctx.moveTo(pred.gx, pred.gy);

    ctx.setLineDash([5, 9]);

    ctx.strokeStyle = "rgba(170,220,255,.45)";
    ctx.lineWidth = 1.8 * aimWeight;
    ctx.beginPath(); ctx.moveTo(ix, iy);

    ctx.stroke();
    arrow(ix + rx * 175, iy + ry * 175, rx, ry, 6, "rgba(170,220,255,.55)");
    ctx.setLineDash([]);
  }
  ctx.restore();
  }

  const gap = 14 + (state === "charge" ? power * power * 110 : 0);
  const a = aimAngle;
  ctx.save();
  ctx.translate(cue.x, cue.y);
  ctx.rotate(a);
  const CS = CUES[cueStyle];
  const cg = ctx.createLinearGradient(-(gap + 420), 0, -gap, 0);
  cg.addColorStop(0, CS.w[0]); cg.addColorStop(0.25, CS.w[1]);
  cg.addColorStop(0.85, CS.w[2]); cg.addColorStop(1, CS.w[3]);

  ctx.moveTo(-gap, -2.6);
  ctx.lineTo(-(gap + 420), -5.5);
  ctx.lineTo(-(gap + 420), 5.5);
  ctx.lineTo(-gap, 2.6);
  ctx.closePath();
  ctx.fillStyle = cg; ctx.fill();
  ctx.fillStyle = CS.wrap;
  ctx.fillRect(-(gap + 300), -5.2, 130, 10.4);
  ctx.fillStyle = CS.accent;
  ctx.fillRect(-(gap + 296), -4.9, 8, 9.8);
  ctx.strokeStyle = "rgba(255,255,255,.25)";
  ctx.lineWidth = 0.75;
  ctx.strokeRect(-(gap + 296), -4.9, 8, 9.8);
  ctx.fillStyle = CS.f;
  ctx.fillRect(-gap - 9, -2.6, 9, 5.2);
  ctx.fillStyle = CS.tip;
  ctx.fillRect(-gap - 2, -2.4, 3.4, 4.8);
  ctx.restore();

    ctx.strokeStyle = "rgba(0,0,0,.35)";

      ctx.shadowBlur = 14;

    if (t.kick[s]) mKick();
    if (t.hat[s]) mHat();
    if (t.sn[s]) mSnare();
    const b = t.bass[s];
    if (b) mBass(mf(root + (DEG[b] || 0)), sd / 1000 * 1.8);
    const l = t.lead[s];
    if (l) mLead(mf(root + 24 + l), sd / 1000 * 1.4);
    if (s === 0 && t.tones) {
      t.tones[musBar % t.tones.length].forEach((iv, k) =>
        padToneTo(mf(root + 12 + iv), sd / 1000 * 15, 0.016 - k * 0.002));
    }
    musStep++;
    if (s === 15) musBar++;
  };
  playStep();
  musTimer = setInterval(playStep, sd);
}
function padToneTo(freq, dur, gain) {
  const a = ac();
  const o = a.createOscillator(), o2 = a.createOscillator(), g = a.createGain();
  o.type = "triangle"; o2.type = "sine";
  o.frequency.value = freq; o2.frequency.value = freq * 1.006;
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.linearRampToValueAtTime(gain, a.currentTime + 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); o2.connect(g); g.connect(master());
  o.start(); o2.start();
  o.stop(a.currentTime + dur); o2.stop(a.currentTime + dur);
  musNodes.push(o, o2, g);
}

function drawPowerGauge() {
  if (state !== "aim" && state !== "charge") return;
  const x = FRAME.x + 18, w = 14;
  const yTop = T + 26, yBot = BT - 26, h = yBot - yTop;
  const fh = h * power;

  ctx.save();
  rr(x - 3, yTop - 3, w + 6, h + 6, 9);
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(216,180,90,.35)"; ctx.stroke();

  if (fh > 0.5) {
    const g = ctx.createLinearGradient(0, yTop, 0, yBot);
    g.addColorStop(0, "#d24b32"); g.addColorStop(0.55, "#e8b23a"); g.addColorStop(1, "#7ec850");
    rr(x, yBot - fh, w, fh, 6);
    ctx.fillStyle = g; ctx.fill();
    if (state === "charge") {
      rr(x, yBot - fh, w, fh, 6);
      ctx.shadowColor = "rgba(255,205,100,.85)";
      ctx.shadowBlur = 10 + power * 10;
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "rgba(255,235,170,.6)";
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = "rgba(0,0,0,.35)";
    for (let i = 1; i < 4; i++) ctx.fillRect(x, yBot - h * i / 4 - 0.5, w, 1);
  }

  for (let i = 1; i < 4; i++) {
    if (yBot - h * i / 4 <= yBot - fh) continue;
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.fillRect(x, yBot - h * i / 4 - 0.5, w, 1);
  }

  const my = yBot - fh;
  ctx.strokeStyle = "rgba(255,255,255,.9)";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 7, my); ctx.lineTo(x + w + 7, my); ctx.stroke();

  const p = Math.round(power * 100);
  ctx.font = "bold 12px Arial";
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = p >= 75 ? "#ffb08a" : "#eadfb9";
  ctx.fillText(p + "%", x + w / 2, yTop - 14);

  ctx.font = "11px PingFang SC, sans-serif";
  ctx.fillStyle = "rgba(232,226,208,.55)";
  ctx.fillText("力 度", x + w / 2, yBot + 20);
  ctx.restore();
}

function drawEffects(dt) {
  effects = effects.filter(f => f.t < 0.6);
  for (const f of effects) {
    f.t += dt;
    const p = f.t / 0.6;
    ctx.beginPath();
    ctx.arc(f.x, f.y, PR + p * 26, 0, 7);
    ctx.strokeStyle = f.c;
    ctx.globalAlpha = (1 - p) * 0.6;
    ctx.lineWidth = 3 * (1 - p) + 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawToast(dt) {
  if (!toast) return;
  toast.t += dt;
  if (toast.t > 2) { toast = null; return; }
  const al = toast.t < 0.3 ? toast.t / 0.3 : toast.t > 1.6 ? (2 - toast.t) / 0.4 : 1;
  ctx.save();
  ctx.globalAlpha = al;
  ctx.font = "600 22px PingFang SC, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(0,0,0,.55)";
  const tw = ctx.measureText(toast.text).width;
  ctx.fillRect(W / 2 - tw / 2 - 22, 96, tw + 44, 44);
  ctx.fillStyle = "#ffe9ad";
  ctx.fillText(toast.text, W / 2, 125);
  ctx.restore();
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  let dt = Math.min((now - last) / 1000, 0.032);
  last = now;

  if (state === "charge") {
    power += chargeDir * dt / 0.95;
    if (power >= 1) { power = 1; chargeDir = -1; }
    if (power <= 0) { power = 0; chargeDir = 1; }
  }

  if (state === "roll") {
    const vmax = balls.reduce((m, b) => b.potted ? m : Math.max(m, Math.hypot(b.vx, b.vy)), 0);
    const steps = Math.min(60, Math.max(1, Math.ceil(vmax * dt / 5)));
    const sd = dt / steps;
    const railContacts = new Set();
    for (let s = 0; s < steps; s++) step(sd, railContacts);

    if (allStopped()) {
      settleShot();
      if (state === "roll") {
        state = "aim";
        if (coarsePointer) power = mobilePower;
        if (!coarsePointer) aimAngle = Math.atan2(mouse.y - cue.y, mouse.x - cue.x);
        syncMobileControls();
      }
      if (online.authorityShotId) queueFinalSnapshot();
    }
  }

  ctx.clearRect(0, 0, W, H);
  drawTable();
  for (const b of balls) drawBall(b);
  drawPlacementGuide();
  drawAiming();
  drawPowerGauge();
  drawEffects(dt);
  drawToast(dt);
  drawScene(dt);

  requestAnimationFrame(frame);
}

setupControls();
updatePointerCapability();
reset();
restoreOnlineSession();
setInterval(() => { if (online.room && (online.room.status === "PAUSED" || online.reconnectUntil)) refreshHud(); }, 1000);
requestAnimationFrame(frame);
})();
</script>
